name: Publish to OPM

on:
  push:
    tags: ['v*']

jobs:
  opm-publish:
    runs-on: ubuntu-latest
    container: openresty/openresty:alpine
    steps:
      - name: Install checkout/opm dependencies
        run: apk add --no-cache git curl bash perl tar

      - uses: actions/checkout@v5

      - name: Sync module _VERSION with dist.ini
        run: |
          version=$(grep -m1 '^version' dist.ini | cut -d= -f2 | tr -d ' ')
          sed -i "s/_VERSION = \"[^\"]*\"/_VERSION = \"$version\"/" lib/resty/digest_auth.lua

      - name: Configure opmrc
        env:
          OPM_TOKEN: ${{ secrets.OPM_TOKEN }}
        run: |
          cat > ~/.opmrc <<EOF
          github_account=ElCruncharino
          github_token=$OPM_TOKEN
          EOF

      - run: opm upload
